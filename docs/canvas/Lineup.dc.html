<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{
  --page:#f4f2eb; --surface:#fbfaf6; --surface-strong:#ffffff; --surface-muted:#eeece4;
  --ink:#142033; --ink-soft:#53627a; --ink-faint:#817e73;
  --line:#ded9cc; --line-strong:#c9c2b2;
  --accent:#2454d9; --accent-soft:#e7edff;
  --shadow:0 14px 36px rgba(54,47,34,.08);
  --hh:#f36f21; --lt:#0b2f58;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{color:#1c44b3}
.tab-num{font-variant-numeric:tabular-nums}
.lu-row{display:grid;grid-template-columns:22px 40px 28px minmax(0,1fr) 34px;align-items:center;gap:9px;height:44px;border-bottom:1px solid var(--line);padding:0 16px}
.lu-row:last-child{border-bottom:0}
</style>
</helmet>

<div style="min-height:100%;background:var(--page)">

  <!-- dialog header -->
  <div style="height:68px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface-strong);display:grid;grid-template-columns:60px 1fr 60px;align-items:center">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#142033" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="justify-self:start"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg>
    <h1 style="margin:0;text-align:center;font-size:20px;letter-spacing:-0.03em">경기 상세</h1>
    <span style="justify-self:end;color:var(--ink-soft);font-weight:700;font-size:14px">공유</span>
  </div>

  <div style="width:100%;padding:18px 16px 30px;display:grid;gap:16px">

    <!-- 요약 (기존 컴포넌트 축약) -->
    <div style="border:1px solid var(--line);border-radius:16px;background:var(--surface-strong);box-shadow:var(--shadow);padding:16px 18px">
      <div style="color:var(--ink-soft);font-size:13px;font-weight:700">
        <span style="display:inline-flex;margin-right:8px;padding:4px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)">예정</span>
        9월 5일 금 · 사직
      </div>
      <div style="display:grid;grid-template-columns:1fr 48px 1fr;align-items:center;margin-top:16px">
        <div>
          <span style="display:flex;align-items:center;gap:8px;font-size:24px;font-weight:850;letter-spacing:-0.04em"><span style="width:24px;height:24px;border-radius:50%;background:var(--hh)"></span>한화</span>
        </div>
        <div style="color:var(--ink-faint);font-weight:800;text-align:center">vs</div>
        <div style="text-align:right;border-right:4px solid var(--lt);padding-right:13px">
          <span style="display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:24px;font-weight:850;letter-spacing:-0.04em"><span style="width:24px;height:24px;border-radius:50%;background:var(--lt)"></span>롯데</span>
        </div>
      </div>
    </div>

    <!-- tabs + lineup -->
    <div style="border:1px solid var(--line);border-radius:16px;background:var(--surface-strong);box-shadow:var(--shadow);overflow:hidden">

      <div style="display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)">
        <span style="min-height:48px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid transparent;color:var(--ink-soft);font-weight:750;font-size:14px">개요</span>
        <span style="min-height:48px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--accent);color:var(--accent);font-weight:750;font-size:14px">라인업</span>
        <span style="min-height:48px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid transparent;color:var(--ink-soft);font-weight:750;font-size:14px">타자</span>
        <span style="min-height:48px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid transparent;color:var(--ink-soft);font-weight:750;font-size:14px">투수</span>
      </div>

      <!-- team toggle -->
      <div style="padding:16px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span style="display:inline-flex;padding:3px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface-muted)">
          <span style="display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface-strong);box-shadow:0 1px 3px rgba(54,47,34,.12);font-size:14px;font-weight:800">
            <span style="width:10px;height:10px;border-radius:50%;background:var(--hh)"></span>한화</span>
          <span style="display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;border-radius:999px;color:var(--ink-soft);font-size:14px;font-weight:750">
            <span style="width:10px;height:10px;border-radius:50%;background:var(--lt)"></span>롯데</span>
        </span>
        <span class="tab-num" style="color:var(--ink-faint);font-size:12px">15:12 발표</span>
      </div>

      <!-- 선발투수 -->
      <div style="margin:0 16px 14px;padding:13px 15px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;gap:12px">
        <span style="color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.04em">선발</span>
        <span class="tab-num" style="color:var(--ink-soft);font-size:13px;font-weight:800">29</span>
        <strong style="font-size:17px;letter-spacing:-0.03em">황준서</strong>
        <span style="margin-left:auto;color:var(--ink-soft);font-size:12px;font-weight:750">좌완 · 좌투</span>
      </div>

      <!-- 타순 -->
      <div style="border-top:1px solid var(--line)">
        <div class="lu-row" style="height:34px;background:var(--surface-muted);border-bottom:1px solid var(--line)">
          <span style="color:var(--ink-faint);font-size:11px;font-weight:750">타순</span>
          <span style="color:var(--ink-faint);font-size:11px;font-weight:750">포지션</span>
          <span class="tab-num" style="color:var(--ink-faint);font-size:11px;font-weight:750;text-align:right">번호</span>
          <span style="color:var(--ink-faint);font-size:11px;font-weight:750">이름</span>
          <span style="color:var(--ink-faint);font-size:11px;font-weight:750;text-align:right">투타</span>
        </div>

        <div class="lu-row"><span class="tab-num" style="color:var(--ink-faint);font-size:13px;font-weight:800">1</span><span style="color:var(--ink-soft);font-size:13px">유격</span><span class="tab-num" style="color:var(--ink-faint);font-size:13px;text-align:right">7</span><strong style="font-size:15px">심우준</strong><span style="color:var(--ink-soft);font-size:12px;text-align:right">우타</span></div>
        <div class="lu-row"><span class="tab-num" style="color:var(--ink-faint);font-size:13px;font-weight:800">2</span><span style="color:var(--ink-soft);font-size:13px">중견</span><span class="tab-num" style="color:var(--ink-faint);font-size:13px;text-align:right">41</span><strong style="font-size:15px">최인호</strong><span style="color:var(--ink-soft);font-size:12px;text-align:right">좌타</span></div>
        <div class="lu-row"><span class="tab-num" style="color:var(--ink-faint);font-size:13px;font-weight:800">3</span><span style="color:var(--ink-soft);font-size:13px">좌익</span><span class="tab-num" style="color:var(--ink-faint);font-size:13px;text-align:right">51</span><strong style="font-size:15px">문현빈</strong><span style="color:var(--ink-soft);font-size:12px;text-align:right">좌타</span></div>
        <div class="lu-row"><span class="tab-num" style="color:var(--ink-faint);font-size:13px;font-weight:800">4</span><span style="color:var(--ink-soft);font-size:13px">지명</span><span class="tab-num" style="color:var(--ink-faint);font-size:13px;text-align:right">50</span><strong style="font-size:15px">강백호</strong><span style="color:var(--ink-soft);font-size:12px;text-align:right">좌타</span></div>
        <div class="lu-row"><span class="tab-num" style="color:var(--ink-faint);font-size:13px;font-weight:800">5</span><span style="color:var(--ink-soft);font-size:13px">3루</span><span class="tab-num" style="color:var(--ink-faint);font-size:13px;text-align:right">8</span><strong style="font-size:15px">노시환</strong><span style="color:var(--ink-soft);font-size:12px;text-align:right">우타</span></div>
        <div class="lu-row"><span class="tab-num" style="color:var(--ink-faint);font-size:13px;font-weight:800">6</span><span style="color:var(--ink-soft);font-size:13px">우익</span><span class="tab-num" style="color:var(--ink-faint);font-size:13px;text-align:right">30</span><strong style="font-size:15px">페라자</strong><span style="color:var(--ink-soft);font-size:12px;text-align:right">양타</span></div>
        <div class="lu-row"><span class="tab-num" style="color:var(--ink-faint);font-size:13px;font-weight:800">7</span><span style="color:var(--ink-soft);font-size:13px">1루</span><span class="tab-num" style="color:var(--ink-faint);font-size:13px;text-align:right">25</span><strong style="font-size:15px">김태연</strong><span style="color:var(--ink-soft);font-size:12px;text-align:right">우타</span></div>
        <div class="lu-row"><span class="tab-num" style="color:var(--ink-faint);font-size:13px;font-weight:800">8</span><span style="color:var(--ink-soft);font-size:13px">포수</span><span class="tab-num" style="color:var(--ink-faint);font-size:13px;text-align:right">59</span><strong style="font-size:15px">허인서</strong><span style="color:var(--ink-soft);font-size:12px;text-align:right">우타</span></div>
        <div class="lu-row"><span class="tab-num" style="color:var(--ink-faint);font-size:13px;font-weight:800">9</span><span style="color:var(--ink-soft);font-size:13px">2루</span><span class="tab-num" style="color:var(--ink-faint);font-size:13px;text-align:right">95</span><strong style="font-size:15px">황영묵</strong><span style="color:var(--ink-soft);font-size:12px;text-align:right">좌타</span></div>
      </div>

      <!-- accordions -->
      <div style="border-top:1px solid var(--line);padding:0 16px">
        <div style="display:flex;align-items:center;gap:10px;height:52px;border-bottom:1px solid var(--line)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#53627a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5 12 15.5 18 9.5"></path></svg>
          <strong style="font-size:14px">불펜 가용</strong>
          <span class="tab-num" style="margin-left:auto;color:var(--ink-soft);font-size:13px;font-weight:750">15명</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;height:52px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#53627a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5 12 15.5 18 9.5"></path></svg>
          <strong style="font-size:14px">대기 타자</strong>
          <span class="tab-num" style="margin-left:auto;color:var(--ink-soft);font-size:13px;font-weight:750">9명</span>
        </div>
      </div>
    </div>

    <p style="margin:0;color:var(--ink-faint);font-size:12px;text-align:center;line-height:1.5">네이버 스포츠 · 15:12 수집<br>예고 라인업은 경기 직전 변경될 수 있습니다</p>
  </div>
</div>
</x-dc>
</body>
</html>
