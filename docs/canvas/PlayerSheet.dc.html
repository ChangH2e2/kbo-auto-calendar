<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{--page:#f4f2eb;--surface-strong:#ffffff;--surface-muted:#eeece4;--ink:#142033;--ink-soft:#53627a;--ink-faint:#817e73;--line:#ded9cc;--line-strong:#c9c2b2;--accent:#2454d9;--accent-soft:#e7edff;--hh:#f36f21}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{color:#1c44b3}
.tab-num{font-variant-numeric:tabular-nums}
</style>
</helmet>

<div style="min-height:100%;background:rgba(9,14,22,.55);display:flex;flex-direction:column;justify-content:flex-end">

  <div style="padding:20px 18px 0;color:rgba(255,255,255,.7);font-size:11px;font-weight:800;letter-spacing:.06em">선수 프로필 시트 · 라인업에서 이름 탭</div>
  <div style="flex:1"></div>

  <div style="border-radius:20px 20px 0 0;background:var(--surface-strong);padding:10px 0 26px">
    <div style="width:38px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 18px"></div>

    <div style="padding:0 20px 18px;border-bottom:1px solid var(--line)">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:8px">
        <span class="tab-num" style="font-size:16px;font-weight:800;color:var(--ink-faint)">51</span>
        <strong style="font-size:27px;font-weight:850;letter-spacing:-0.04em">문현빈</strong>
      </div>
      <div style="display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:14px;font-weight:700">
        <span style="width:11px;height:11px;border-radius:50%;background:var(--hh)"></span>
        한화 이글스 · 외야수 · 우투좌타
      </div>
      <div class="tab-num" style="margin-top:6px;color:var(--ink-soft);font-size:14px">2004년생 · 174cm</div>
    </div>

    <div style="padding:16px 20px;border-bottom:1px solid var(--line)">
      <div style="margin-bottom:9px;color:var(--ink-faint);font-size:11px;font-weight:800;letter-spacing:.04em">오늘</div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:850" class="tab-num">3</span>
        <strong style="font-size:16px">좌익수 선발</strong>
        <span style="margin-left:auto;color:var(--ink-soft);font-size:13px;font-weight:750">한화 vs 롯데 · 사직</span>
      </div>
    </div>

    <div style="padding:16px 20px 20px">
      <div style="display:flex;align-items:center;gap:11px;padding:14px 16px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface-muted)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#53627a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto">
          <rect x="2.5" y="7.5" width="19" height="10" rx="4"></rect><path d="M7 11v3M5.5 12.5h3M15.5 11.5h.01M18 13.8h.01"></path>
        </svg>
        <span style="min-width:0">
          <strong style="display:block;font-size:14px">야구 Who Are Ya 에서 만나기</strong>
          <span style="display:block;color:var(--ink-soft);font-size:12px">games.salarycrew.com</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#53627a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;flex:0 0 auto"><path d="M9 5.5 15.5 12 9 18.5"></path></svg>
      </div>
      <p style="margin:14px 2px 0;color:var(--ink-faint);font-size:12px;line-height:1.55">
        년생·키·세부 포지션은 Who Are Ya 선수 마스터에서 온다. 매칭 실패는 조용히 넘기고 이름만 렌더한다 — 이름만으로도 라인업은 완성된 정보다.
      </p>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
