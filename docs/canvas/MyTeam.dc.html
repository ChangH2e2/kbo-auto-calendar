<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{
  --page:#f4f2eb; --surface:#fbfaf6; --surface-strong:#ffffff; --surface-muted:#eeece4;
  --ink:#142033; --ink-soft:#53627a; --ink-faint:#817e73;
  --line:#ded9cc; --line-strong:#c9c2b2; --accent:#2454d9; --accent-soft:#e7edff;
  --amber:#a44b0c; --amber-soft:#fff2e3; --danger:#973c42; --danger-soft:#fae9e9;
  --shadow:0 14px 36px rgba(54,47,34,.08); --hh:#f36f21;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{color:#1c44b3}
.tab-num{font-variant-numeric:tabular-nums}
.card{border:1px solid var(--line);border-radius:16px;background:var(--surface-strong);box-shadow:var(--shadow)}
.tx{display:grid;grid-template-columns:20px 46px 30px minmax(0,1fr) auto;align-items:center;gap:10px;height:46px}
</style>
</helmet>

<div style="min-height:100%;background:var(--page);padding-bottom:76px;position:relative">

  <div style="height:68px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fbfaf6">
    <span style="display:flex;align-items:center;gap:10px">
      <span style="width:14px;height:14px;border-radius:50%;background:var(--hh)"></span>
      <strong style="font-size:20px;font-weight:850;letter-spacing:-0.04em">한화 이글스</strong>
    </span>
    <span style="color:var(--accent);font-weight:800;font-size:13px">팀 변경</span>
  </div>

  <div style="padding:18px 16px 0;display:grid;gap:16px">

    <!-- 등록 요약 -->
    <div class="card" style="padding:18px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px">
        <h2 style="margin:0;font-size:18px;letter-spacing:-0.03em">1군 등록</h2>
        <span class="tab-num" style="font-size:26px;font-weight:850;letter-spacing:-0.04em">63<span style="font-size:14px;font-weight:750;color:var(--ink-soft)">명</span></span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
        <div style="padding:11px 8px;border-radius:12px;background:var(--surface-muted);text-align:center">
          <span class="tab-num" style="display:block;font-size:19px;font-weight:850">30</span>
          <span style="color:var(--ink-soft);font-size:11px;font-weight:750">투수</span></div>
        <div style="padding:11px 8px;border-radius:12px;background:var(--surface-muted);text-align:center">
          <span class="tab-num" style="display:block;font-size:19px;font-weight:850">3</span>
          <span style="color:var(--ink-soft);font-size:11px;font-weight:750">포수</span></div>
        <div style="padding:11px 8px;border-radius:12px;background:var(--surface-muted);text-align:center">
          <span class="tab-num" style="display:block;font-size:19px;font-weight:850">15</span>
          <span style="color:var(--ink-soft);font-size:11px;font-weight:750">내야수</span></div>
        <div style="padding:11px 8px;border-radius:12px;background:var(--surface-muted);text-align:center">
          <span class="tab-num" style="display:block;font-size:19px;font-weight:850">15</span>
          <span style="color:var(--ink-soft);font-size:11px;font-weight:750">외야수</span></div>
      </div>
    </div>

    <!-- 오늘의 변동 -->
    <div class="card" style="overflow:hidden">
      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:16px 18px 10px">
        <h2 style="margin:0;font-size:18px;letter-spacing:-0.03em">오늘의 변동</h2>
        <span class="tab-num" style="color:var(--ink-soft);font-size:13px;font-weight:750">9월 6일</span>
      </div>
      <div style="padding:0 18px 8px">
        <div class="tx">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2454d9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 11.5 12 5.5l6 6"></path></svg>
          <span style="color:var(--accent);font-size:12px;font-weight:800">등록</span>
          <span class="tab-num" style="color:var(--ink-faint);font-size:13px;text-align:right">55</span>
          <strong style="font-size:15px">김서현</strong>
          <span style="color:var(--ink-soft);font-size:12px">투수</span>
        </div>
        <div class="tx" style="border-top:1px solid var(--line)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#973c42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M6 12.5 12 18.5l6-6"></path></svg>
          <span style="color:var(--danger);font-size:12px;font-weight:800">말소</span>
          <span class="tab-num" style="color:var(--ink-faint);font-size:13px;text-align:right">61</span>
          <strong style="font-size:15px">이민우</strong>
          <span style="color:var(--ink-soft);font-size:12px">투수</span>
        </div>
      </div>
    </div>

    <!-- 최근 변동 -->
    <div class="card" style="overflow:hidden">
      <h2 style="margin:0;padding:16px 18px 10px;font-size:18px;letter-spacing:-0.03em">최근 변동</h2>
      <div style="padding:0 18px 14px">
        <div style="display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)">
          <span class="tab-num" style="color:var(--ink-faint);font-size:13px;font-weight:750;padding-top:2px">9/5</span>
          <span style="display:grid;gap:6px">
            <span style="display:flex;align-items:center;gap:8px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2454d9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 11.5 12 5.5l6 6"></path></svg><strong style="font-size:14px">문동주</strong><span style="color:var(--ink-soft);font-size:12px">투수</span></span>
            <span style="display:flex;align-items:center;gap:8px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#973c42" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M6 12.5 12 18.5l6-6"></path></svg><strong style="font-size:14px">한승혁</strong><span style="color:var(--ink-soft);font-size:12px">투수</span></span>
          </span>
        </div>
        <div style="display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)">
          <span class="tab-num" style="color:var(--ink-faint);font-size:13px;font-weight:750;padding-top:2px">9/3</span>
          <span style="display:flex;align-items:center;gap:8px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2454d9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 11.5 12 5.5l6 6"></path></svg><strong style="font-size:14px">이진영</strong><span style="color:var(--ink-soft);font-size:12px">외야수</span></span>
        </div>
        <div style="display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)">
          <span class="tab-num" style="color:var(--ink-faint);font-size:13px;font-weight:750;padding-top:2px">8/31</span>
          <span style="display:flex;align-items:center;gap:8px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#973c42" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M6 12.5 12 18.5l6-6"></path></svg><strong style="font-size:14px">김범수</strong><span style="color:var(--ink-soft);font-size:12px">투수</span></span>
        </div>
        <div style="padding-top:12px;border-top:1px solid var(--line)">
          <span style="color:var(--accent);font-weight:800;font-size:14px">더 보기</span>
        </div>
      </div>
    </div>

    <!-- 등록 명단 -->
    <div class="card" style="overflow:hidden">
      <h2 style="margin:0;padding:16px 18px 8px;font-size:18px;letter-spacing:-0.03em">등록 명단</h2>
      <div style="padding:0 18px 6px">
        <div style="display:flex;align-items:center;gap:10px;height:50px;border-top:1px solid var(--line)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#53627a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5 12 15.5 18 9.5"></path></svg>
          <strong style="font-size:14px">투수</strong><span class="tab-num" style="margin-left:auto;color:var(--ink-soft);font-size:13px;font-weight:750">30명</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;height:50px;border-top:1px solid var(--line)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#53627a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5 12 15.5 18 9.5"></path></svg>
          <strong style="font-size:14px">포수</strong><span class="tab-num" style="margin-left:auto;color:var(--ink-soft);font-size:13px;font-weight:750">3명</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;height:50px;border-top:1px solid var(--line)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#53627a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5 12 15.5 18 9.5"></path></svg>
          <strong style="font-size:14px">내야수</strong><span class="tab-num" style="margin-left:auto;color:var(--ink-soft);font-size:13px;font-weight:750">15명</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;height:50px;border-top:1px solid var(--line)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#53627a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5 12 15.5 18 9.5"></path></svg>
          <strong style="font-size:14px">외야수</strong><span class="tab-num" style="margin-left:auto;color:var(--ink-soft);font-size:13px;font-weight:750">15명</span>
        </div>
      </div>
    </div>

    <p style="margin:2px 0 0;color:var(--ink-faint);font-size:12px;text-align:center">KBO 공식 등록 현황 · 매일 06:00 수집</p>
  </div>

  <div style="position:absolute;bottom:0;left:0;right:0;min-height:68px;padding:7px 8px;border-top:1px solid var(--line);background:var(--surface-strong);display:grid;grid-template-columns:repeat(4,1fr)">
    <span style="display:grid;justify-items:center;align-content:center;gap:3px;color:var(--ink-faint)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5.5 9.5V20h13V9.5"></path></svg><strong style="font-size:12px">오늘</strong></span>
    <span style="display:grid;justify-items:center;align-content:center;gap:3px;color:var(--ink-faint)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"></rect><path d="M3.5 9.5h17M8.5 3v3M15.5 3v3"></path></svg><strong style="font-size:12px">일정</strong></span>
    <span style="display:grid;justify-items:center;align-content:center;gap:3px;color:var(--accent)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"></circle><path d="M3.5 20c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5"></path><path d="M16 6.2a3 3 0 0 1 0 5.6M17.5 20c0-2.6-1-4.4-2.6-5.2"></path></svg><strong style="font-size:12px">내 팀</strong></span>
    <span style="display:grid;justify-items:center;align-content:center;gap:3px;color:var(--ink-faint)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"></path></svg><strong style="font-size:12px">설정</strong></span>
  </div>
</div>
</x-dc>
</body>
</html>
