name: KBO-Roster
on:
  workflow_dispatch:
    inputs:
      days:
        description: '되메울 일수 (기본 1 = 오늘만)'
        required: false
        default: '1'
  schedule:
    # KBO 등록/말소는 하루 단위로 바뀌고 오전에 확정된다.
    # GitHub의 schedule이 늦어도 Register.aspx가 과거 날짜를 조회할 수 있어 복구된다.
    - cron: '0 21,3 * * *'

concurrency:
  group: kbo-roster
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Collect roster
        env:
          KBO_INGEST_URL: ${{ secrets.KBO_INGEST_URL }}
          KBO_INGEST_TOKEN: ${{ secrets.KBO_INGEST_TOKEN }}
          # 스케줄 실행은 3일치를 되메워 놓친 날을 자동 복구한다.
          KBO_ROSTER_DAYS: ${{ github.event.inputs.days || '3' }}
        run: python roster.py
