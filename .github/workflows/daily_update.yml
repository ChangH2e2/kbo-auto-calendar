name: KBO-Bot
on:
  schedule:
    # 시즌 일정과 최근 박스스코어만 담당한다.
    # 경기 중 점수·이닝과 프리뷰는 Cloudflare 크론(workers/live-cron → /api/live-refresh)이 1분마다 갱신한다.
    # GitHub의 schedule 이벤트는 요청한 주기를 지키지 않는다 — 2026-09-05~06 실측으로 '*/10'이
    # 실제로는 105~280분 간격으로 왔다. 라이브 데이터를 여기에 걸어 두면 안 된다.
    - cron: '*/30 * * * *'
  workflow_dispatch: 

concurrency:
  group: kbo-daily-ingest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Run API tests
        run: node --test tests/*.test.mjs
      - name: Run Crawler
        env:
          KBO_INGEST_URL: ${{ secrets.KBO_INGEST_URL }}
          KBO_INGEST_TOKEN: ${{ secrets.KBO_INGEST_TOKEN }}
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
          # 아래 세 플래그는 Cloudflare 크론이 멈췄을 때를 대비한 이중화다. 주 경로가 아니다.
          KBO_COLLECT_DETAILS: '1'
          KBO_DETAIL_WINDOW_DAYS: '0'
          KBO_NAVER_LIVE: '1'
          KBO_COLLECT_PREVIEWS: '1'
        run: python crawling.py
