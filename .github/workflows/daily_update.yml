name: KBO-Bot
on:
  schedule:
    - cron: '*/10 * * * *' # 경기 중 점수 반영을 위해 10분마다 실행
  workflow_dispatch: 

concurrency:
  group: kbo-daily-ingest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Run API tests
        run: node --test tests/*.test.mjs
      - name: Run Crawler
        env:
          KBO_INGEST_URL: ${{ secrets.KBO_INGEST_URL }}
          KBO_INGEST_TOKEN: ${{ secrets.KBO_INGEST_TOKEN }}
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
          KBO_COLLECT_DETAILS: '0'
        run: python crawling.py
