name: KBO-Detail-Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'

concurrency:
  group: kbo-detail-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Run API tests
        run: node --test tests/*.test.mjs
      - name: Refresh recent boxscores
        env:
          KBO_INGEST_URL: ${{ secrets.KBO_INGEST_URL }}
          KBO_INGEST_TOKEN: ${{ secrets.KBO_INGEST_TOKEN }}
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
          KBO_COLLECT_DETAILS: '1'
          KBO_DETAIL_WINDOW_DAYS: '14'
        run: python crawling.py
