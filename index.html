<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚾️ KBO 스마트 캘린더</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-1 md:p-4">
    <div class="max-w-6xl mx-auto">
        <header class="bg-white p-2 md:p-5 md:rounded-xl shadow-sm mb-2 flex flex-col md:flex-row justify-between items-center gap-2 sticky top-0 z-10 md:static">
            <div class="flex items-center justify-between w-full md:w-auto gap-2">
                <button id="prevBtn" class="p-1.5 px-3 bg-gray-100 rounded-lg font-bold">◀</button>
                <h1 id="viewTitle" class="text-base md:text-2xl font-black text-gray-800 underline decoration-blue-500 decoration-4">로딩중...</h1>
                <button id="nextBtn" class="p-1.5 px-3 bg-gray-100 rounded-lg font-bold">▶</button>
            </div>
            <div class="flex items-center justify-between w-full md:w-auto gap-2">
                <div class="flex bg-gray-100 p-1 rounded-lg shrink-0">
                    <button id="modeMonth" class="px-3 py-1.5 rounded-md text-xs font-bold bg-white shadow-sm text-blue-600 transition-all">월간</button>
                    <button id="modeWeek" class="px-3 py-1.5 rounded-md text-xs font-bold text-gray-500 hover:text-gray-800 transition-all">주간</button>
                </div>
                <select id="teamFilter" class="flex-1 md:flex-none border-2 border-gray-100 p-1.5 rounded-lg text-xs md:text-sm font-bold bg-gray-50">
                    <option value="전체">전체 구단</option>
                    <option value="KIA">KIA</option><option value="KT">KT</option><option value="LG">LG</option><option value="NC">NC</option><option value="SSG">SSG</option><option value="두산">두산</option><option value="롯데">롯데</option><option value="삼성">삼성</option><option value="키움">키움</option><option value="한화">한화</option>
                </select>
            </div>
        </header>
        <div id="weekHeader" class="grid grid-cols-7 mb-1 text-center font-black text-gray-400 text-[0.6rem] md:text-xs uppercase px-0.5">
            <div class="text-red-400">Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div class="text-blue-400">Sat</div>
        </div>
        <div id="calendar" class="w-full pb-6 md:pb-0"></div>
    </div>
<script>
    const SUPABASE_URL = 'https://rqdwdortnbpkpipussah.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_72QYev7CliIOdaHVa9caFg_mm19QiZE';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allMatches = [], currentDate = new Date(), holidays = {}, loadedHolidayYear = null, viewMode = 'month';
    const dayNames = ['일', '월', '화', '수', '목', '금', '토'];

    async function fetchMatches() {
        const { data } = await _supabase.from('kbo_matches').select('*').order('date', {ascending: true});
        allMatches = data || []; renderView();
    }
    async function loadHolidays(year) {
        if (year !== loadedHolidayYear) {
            try {
                // 공공데이터포털 API 연동
                const res = await fetch(`https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo?solYear=${year}&ServiceKey=4b4ad3442715e2758dd90b80e40e0a219d74b6ca6f870ad85cdeb8a37709e073&_type=json&numOfRows=50`);
                const json = await res.json();
                const items = json.response?.body?.items?.item;
                if (items) {
                    holidays = {};
                    (Array.isArray(items)?items:[items]).forEach(h => { holidays[String(h.locdate).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3')] = h.dateName; });
                }
                loadedHolidayYear = year;
            } catch(e) {}
        }
    }
    function getMatchHTML(m, mode) {
        const isUchwi = m.stadium.includes("우취");
        const stadium = m.stadium.replace("(우취)", "").trim();
        let scoreHtml;
        if (isUchwi) scoreHtml = `<span class="text-blue-500 font-bold text-[0.6rem] md:text-xs bg-blue-50 px-1 py-0.5 rounded">우취</span>`;
        else if (m.home_score !== null) {
            const hB = m.home_score > m.away_score ? 'bg-red-600' : 'bg-gray-700';
            const aB = m.away_score > m.home_score ? 'bg-red-600' : 'bg-gray-700';
            scoreHtml = `<span class="${hB} text-white px-1.5 py-0.5 rounded text-[0.6rem] md:text-xs">${m.home_score}</span> : <span class="${aB} text-white px-1.5 py-0.5 rounded text-[0.6rem] md:text-xs">${m.away_score}</span>`;
        } else scoreHtml = `<span class="text-gray-300 text-[0.6rem] md:text-xs">vs</span>`;
        
        const cardClass = mode === 'week' ? 'p-3 mb-2' : 'p-1 mb-1';
        const txtSize = mode === 'week' ? 'text-sm md:text-base' : 'text-[0.6rem] md:text-xs';

        return `<div class="bg-white border border-gray-100 rounded-lg ${cardClass} flex flex-col items-center shadow-sm">
            <div class="flex justify-between items-center w-full font-bold ${txtSize}">
                <div class="flex-1 text-right truncate">${m.home}</div><div class="px-2">${scoreHtml}</div><div class="flex-1 text-left truncate">${m.away}</div>
            </div>
            <div class="text-[0.5rem] md:text-[0.6rem] text-gray-400 mt-1">📍${stadium} | ${m.time}</div>
        </div>`;
    }
    async function renderView() {
        await loadHolidays(currentDate.getFullYear());
        const container = document.getElementById('calendar');
        const filter = document.getElementById('teamFilter').value;
        container.innerHTML = '';
        if (viewMode === 'month') {
            const y = currentDate.getFullYear(), m = currentDate.getMonth() + 1, ms = String(m).padStart(2,'0');
            document.getElementById('viewTitle').innerText = `${y}년 ${m}월`;
            document.getElementById('weekHeader').classList.remove('hidden');
            container.className = 'grid grid-cols-7 gap-[1px] bg-gray-200 border border-gray-200 rounded-lg overflow-hidden';
            const startDay = new Date(y, m-1, 1).getDay(), days = new Date(y, m, 0).getDate();
            for(let i=0; i<startDay; i++) container.innerHTML += '<div class="bg-gray-50/40 min-h-[100px] md:min-h-[130px]"></div>';
            for(let d=1; d<=days; d++) {
                const ds = `${y}-${ms}-${String(d).padStart(2,'0')}`;
                const matches = allMatches.filter(mt => mt.date === ds && (filter === '전체' || mt.home.includes(filter) || mt.away.includes(filter)));
                const dayOfWeek = new Date(y, m-1, d).getDay(), hName = holidays[ds];
                let color = (dayOfWeek===0||hName)?'text-red-500':(dayOfWeek===6?'text-blue-500':'text-gray-700');
                let dayDiv = `<div class="bg-white p-1 min-h-[100px] md:min-h-[130px] flex flex-col border-b border-gray-100">
                    <div class="text-center md:text-left mb-1"><span class="text-xs md:text-sm font-black ${color}">${d}</span><span class="text-[0.45rem] text-red-500 ml-1 truncate">${hName||''}</span></div>`;
                matches.forEach(mt => dayDiv += getMatchHTML(mt, 'month'));
                container.innerHTML += dayDiv + `</div>`;
            }
        } else {
            document.getElementById('weekHeader').classList.add('hidden');
            container.className = 'flex flex-col gap-2 p-1 md:px-0';
            const startOfWeek = new Date(currentDate); startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());
            document.getElementById('viewTitle').innerText = `${startOfWeek.getMonth()+1}.${startOfWeek.getDate()} ~ 주간 일정`;
            for(let i=0; i<7; i++) {
                const d = new Date(startOfWeek); d.setDate(startOfWeek.getDate()+i);
                const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                const matches = allMatches.filter(mt => mt.date === ds && (filter === '전체' || mt.home.includes(filter) || mt.away.includes(filter)));
                if(matches.length===0 && filter!=='전체') continue;
                let dayDiv = `<div class="bg-gray-50/80 p-3 rounded-xl border border-gray-200">
                    <div class="font-bold text-sm md:text-lg mb-2 ${i===0||holidays[ds]?'text-red-500':(i===6?'text-blue-500':'text-gray-800')}">${ds} (${dayNames[i]}) ${holidays[ds]||''}</div>`;
                matches.length?matches.forEach(mt=>dayDiv+=getMatchHTML(mt,'week')):dayDiv+=`<div class="text-center text-gray-400 py-4 bg-white rounded-lg border border-dashed border-gray-200">경기 없음</div>`;
                container.innerHTML += dayDiv + `</div>`;
            }
        }
    }
    document.getElementById('prevBtn').onclick = () => { viewMode==='month'?currentDate.setMonth(currentDate.getMonth()-1):currentDate.setDate(currentDate.getDate()-7); renderView(); };
    document.getElementById('nextBtn').onclick = () => { viewMode==='month'?currentDate.setMonth(currentDate.getMonth()+1):currentDate.setDate(currentDate.getDate()+7); renderView(); };
    document.getElementById('modeMonth').onclick = (e) => { viewMode='month'; e.target.className="px-3 py-1.5 rounded-md text-xs font-bold bg-white shadow-sm text-blue-600 transition-all"; document.getElementById('modeWeek').className="px-3 py-1.5 rounded-md text-xs font-bold text-gray-500"; renderView(); };
    document.getElementById('modeWeek').onclick = (e) => { viewMode='week'; e.target.className="px-3 py-1.5 rounded-md text-xs font-bold bg-white shadow-sm text-blue-600 transition-all"; document.getElementById('modeMonth').className="px-3 py-1.5 rounded-md text-xs font-bold text-gray-500"; renderView(); };
    document.getElementById('teamFilter').onchange = renderView;
    fetchMatches();
</script>
</body>
</html>
