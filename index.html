<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚾️ KBO 스마트 캘린더</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .inning-cell { width: 22px; text-align: center; font-size: 0.65rem; border-right: 1px solid #f3f4f6; padding: 4px 0; }
        .rheb-cell { width: 26px; text-align: center; font-weight: bold; background-color: #f9fafb; font-size: 0.7rem; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-1 md:p-4">
    <div class="max-w-6xl mx-auto">
        <header class="bg-white p-2 md:p-5 md:rounded-xl shadow-sm mb-2 flex flex-col md:flex-row justify-between items-center gap-2 sticky top-0 z-10 md:static">
            <div class="flex items-center justify-between w-full md:w-auto gap-2">
                <button id="prevBtn" class="p-2 px-3 bg-gray-100 rounded-lg font-bold">◀</button>
                <h1 id="viewTitle" class="text-lg md:text-2xl font-black text-gray-800 underline decoration-blue-500 decoration-4">로딩중...</h1>
                <button id="nextBtn" class="p-2 px-3 bg-gray-100 rounded-lg font-bold">▶</button>
            </div>
            <div class="flex items-center gap-2">
                <div class="flex bg-gray-100 p-1 rounded-lg">
                    <button id="modeMonth" class="px-3 py-1.5 rounded-md text-xs font-bold bg-white shadow-sm text-blue-600">월간</button>
                    <button id="modeWeek" class="px-3 py-1.5 rounded-md text-xs font-bold text-gray-500">주간</button>
                </div>
                <select id="teamFilter" class="border-2 border-gray-100 p-1.5 rounded-lg text-xs font-bold bg-gray-50">
                    <option value="전체">전체 구단</option>
                    <option value="KIA">KIA</option><option value="KT">KT</option><option value="LG">LG</option><option value="NC">NC</option><option value="SSG">SSG</option><option value="두산">두산</option><option value="롯데">롯데</option><option value="삼성">삼성</option><option value="키움">키움</option><option value="한화">한화</option>
                </select>
            </div>
        </header>

        <div id="weekHeader" class="grid grid-cols-7 mb-1 text-center font-black text-gray-400 text-[0.65rem] md:text-xs uppercase px-1">
            <div class="text-red-400">Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div class="text-blue-400">Sat</div>
        </div>
        <div id="calendar" class="w-full pb-6 md:pb-0"></div>
    </div>

    <div id="detailModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-gray-800 p-4 text-white flex justify-between items-center">
                <h2 class="font-black text-sm">GAME CENTER</h2>
                <button onclick="closeModal()" class="text-xl">×</button>
            </div>
            <div id="modalBody" class="p-4 bg-white"></div>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://rqdwdortnbpkpipussah.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_72QYev7CliIOdaHVa9caFg_mm19QiZE';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allMatches = [], currentDate = new Date(), holidays = {}, loadedHolidayYear = null, viewMode = 'month';

    async function fetchMatches() {
        const { data } = await _supabase.from('kbo_matches').select('*').order('date', {ascending: true});
        allMatches = data || []; renderView();
    }

    function openDetail(gameId) {
        const m = allMatches.find(x => x.game_id === gameId);
        if(!m || !m.home_line) return;
        
        const hL = m.home_line.split('|'), aL = m.away_line.split('|');
        const hRHEB = m.home_rheb.split('|'), aRHEB = m.away_rheb.split('|');
        
        let innings = '';
        for(let i=1; i<=Math.max(hL.length, 9); i++) innings += `<th class="inning-cell">${i}</th>`;

        const getCells = (line) => {
            let res = '';
            line.forEach(s => res += `<td class="inning-cell font-bold">${s}</td>`);
            for(let i=line.length; i<Math.max(line.length, 9); i++) res += `<td class="inning-cell">-</td>`;
            return res;
        };

        document.getElementById('modalBody').innerHTML = `
            <div class="flex justify-between items-center mb-6 px-2">
                <div class="text-center"><div class="text-xl font-black">${m.away}</div><div class="text-[0.6rem] text-gray-400">AWAY</div></div>
                <div class="text-3xl font-black text-blue-600">${m.away_score} : ${m.home_score}</div>
                <div class="text-center"><div class="text-xl font-black">${m.home}</div><div class="text-[0.6rem] text-gray-400">HOME</div></div>
            </div>
            <div class="overflow-x-auto border rounded-lg shadow-sm">
                <table class="w-full border-collapse">
                    <thead class="bg-gray-50 border-b">
                        <tr><th class="p-2 text-[0.65rem] text-left">팀</th>${innings}<th class="rheb-cell">R</th><th class="rheb-cell">H</th><th class="rheb-cell">E</th><th class="rheb-cell">B</th></tr>
                    </thead>
                    <tbody>
                        <tr class="border-b"><td class="p-2 text-[0.7rem] font-bold bg-gray-50">${m.away}</td>${getCells(aL)}<td class="rheb-cell text-red-500">${aRHEB[0]}</td><td class="rheb-cell">${aRHEB[1]}</td><td class="rheb-cell">${aRHEB[2]}</td><td class="rheb-cell">${aRHEB[3]}</td></tr>
                        <tr><td class="p-2 text-[0.7rem] font-bold bg-gray-50">${m.home}</td>${getCells(hL)}<td class="rheb-cell text-red-500">${hRHEB[0]}</td><td class="rheb-cell">${hRHEB[1]}</td><td class="rheb-cell">${hRHEB[2]}</td><td class="rheb-cell">${hRHEB[3]}</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="mt-4 text-center text-[0.6rem] text-gray-400">📍 ${m.stadium} | 경기 정보는 KBO 제공 데이터를 바탕으로 합니다.</div>
        `;
        document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('detailModal').classList.add('hidden'); }

    function getMatchHTML(m, mode) {
        const isUchwi = m.stadium.includes("우천취소");
        // 모바일 사이즈 원복 (text-xs 수준으로 상향)
        const txtSize = mode === 'month' ? 'text-[0.55rem] md:text-xs' : 'text-sm md:text-base';
        const score = isUchwi ? `<span class="text-red-500 font-bold text-[0.5rem] md:text-[0.6rem] bg-red-50 px-1 rounded border border-red-100">우천취소</span>` : 
                    (m.home_score !== null ? `<span class="${m.home_score>m.away_score?'bg-red-600':'bg-gray-800'} text-white px-1 rounded">${m.home_score}</span> : <span class="${m.away_score>m.home_score?'bg-red-600':'bg-gray-700'} text-white px-1 rounded">${m.away_score}</span>` : `<span class="text-gray-300">vs</span>`);
        
        return `<div onclick="openDetail('${m.game_id}')" class="cursor-pointer bg-white border border-gray-100 rounded p-1.5 mb-1 flex flex-col items-center shadow-sm hover:border-blue-400 transition-all">
            <div class="flex justify-between items-center w-full font-bold ${txtSize} tracking-tighter">
                <div class="flex-1 text-right truncate">${m.home}<span class="text-[0.45rem] md:text-[0.6rem] text-gray-300 font-normal ml-0.5">(홈)</span></div>
                <div class="px-1">${score}</div>
                <div class="flex-1 text-left truncate"><span class="text-[0.45rem] md:text-[0.6rem] text-gray-300 font-normal mr-0.5">(원)</span>${m.away}</div>
            </div>
            <div class="text-[0.45rem] md:text-[0.55rem] text-gray-400 mt-1">📍 ${m.stadium.replace("(우천취소)","")} | ${m.time}</div>
        </div>`;
    }

    // renderView 및 기타 요일 설정 등은 기존 로직 유지
    async function renderView() {
        const container = document.getElementById('calendar');
        const filter = document.getElementById('teamFilter').value;
        container.innerHTML = '';
        if (viewMode === 'month') {
            const y = currentDate.getFullYear(), m = currentDate.getMonth() + 1;
            document.getElementById('viewTitle').innerText = `${y}년 ${m}월`;
            container.className = 'grid grid-cols-7 gap-[1px] bg-gray-200 border border-gray-200 rounded-lg overflow-hidden';
            const startDay = new Date(y, m-1, 1).getDay(), days = new Date(y, m, 0).getDate();
            for(let i=0; i<startDay; i++) container.innerHTML += '<div class="bg-gray-50/40 min-h-[100px]"></div>';
            for(let d=1; d<=days; d++) {
                const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const matches = allMatches.filter(mt => mt.date === ds && (filter === '전체' || mt.home.includes(filter) || mt.away.includes(filter)));
                let dayDiv = `<div class="bg-white p-1 min-h-[100px] flex flex-col border-b border-gray-100"><div class="text-xs font-black mb-1">${d}</div>`;
                matches.forEach(mt => dayDiv += getMatchHTML(mt, 'month'));
                container.innerHTML += dayDiv + `</div>`;
            }
        } else {
            // 주간 뷰 로직 (기존과 동일하게 시원하게 표시)
            container.className = 'flex flex-col gap-2 p-1';
            const startOfWeek = new Date(currentDate); startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());
            document.getElementById('viewTitle').innerText = `주간 일정`;
            for(let i=0; i<7; i++) {
                const d = new Date(startOfWeek); d.setDate(startOfWeek.getDate()+i);
                const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                const matches = allMatches.filter(mt => mt.date === ds && (filter === '전체' || mt.home.includes(filter) || mt.away.includes(filter)));
                let dayDiv = `<div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200"><div class="font-bold text-sm mb-2">${ds}</div>`;
                matches.forEach(mt => dayDiv += getMatchHTML(mt, 'week'));
                container.innerHTML += dayDiv + `</div>`;
            }
        }
    }
    
    document.getElementById('modeMonth').onclick = () => { viewMode='month'; renderView(); };
    document.getElementById('modeWeek').onclick = () => { viewMode='week'; renderView(); };
    document.getElementById('prevBtn').onclick = () => { viewMode==='month'?currentDate.setMonth(currentDate.getMonth()-1):currentDate.setDate(currentDate.getDate()-7); renderView(); };
    document.getElementById('nextBtn').onclick = () => { viewMode==='month'?currentDate.setMonth(currentDate.getMonth()+1):currentDate.setDate(currentDate.getDate()+7); renderView(); };
    document.getElementById('teamFilter').onchange = renderView;
    fetchMatches();
</script>
</body>
</html>
