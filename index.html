<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚾️ KBO 스마트 캘린더</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .inning-cell { width: 24px; text-align: center; font-size: 0.7rem; border-right: 1px solid #f3f4f6; padding: 6px 0; }
        .rheb-cell { width: 30px; text-align: center; font-weight: bold; background-color: #f9fafb; font-size: 0.75rem; }
        .today-card { border: 2px solid #3b82f6 !important; background-color: #eff6ff !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-2 md:p-4">
    <div class="max-w-6xl mx-auto">
        <header class="bg-white p-4 rounded-xl shadow-sm mb-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <button id="prevBtn" class="p-2 px-4 bg-gray-100 rounded-lg font-bold hover:bg-gray-200">◀</button>
                <h1 id="viewTitle" class="text-xl font-black text-gray-800">로딩중...</h1>
                <button id="nextBtn" class="p-2 px-4 bg-gray-100 rounded-lg font-bold hover:bg-gray-200">▶</button>
            </div>
            <div class="flex gap-2">
                <select id="teamFilter" class="border-2 border-gray-100 p-2 rounded-lg text-sm font-bold">
                    <option value="전체">전체 구단</option>
                    <option value="KIA">KIA</option><option value="KT">KT</option><option value="LG">LG</option><option value="NC">NC</option><option value="SSG">SSG</option><option value="두산">두산</option><option value="롯데">롯데</option><option value="삼성">삼성</option><option value="키움">키움</option><option value="한화">한화</option>
                </select>
                <div class="flex bg-gray-100 p-1 rounded-lg">
                    <button id="modeMonth" class="px-4 py-1 rounded-md text-sm font-bold bg-white shadow-sm text-blue-600">월간</button>
                    <button id="modeWeek" class="px-4 py-1 rounded-md text-sm font-bold text-gray-500">주간</button>
                </div>
            </div>
        </header>
        <div id="calendar" class="w-full grid grid-cols-7 gap-1 md:gap-2"></div>
    </div>

    <div id="detailModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-gray-800 p-4 text-white flex justify-between items-center">
                <h2 id="modalTitle" class="font-black text-sm">GAME CENTER</h2>
                <button onclick="closeModal()" class="text-2xl">&times;</button>
            </div>
            <div id="modalBody" class="p-6 bg-white"></div>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_KEY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let allMatches = [], currentDate = new Date(), viewMode = 'month';
    
    // [수정] 오늘 날짜 동적 생성 (하드코딩 제거)
    const now = new Date();
    const TODAY_STR = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

    async function fetchMatches() {
        const { data } = await _supabase.from('kbo_matches').select('*').order('date', {ascending: true});
        allMatches = data || []; renderView();
    }

    function openDetail(gameId) {
        const m = allMatches.find(x => x.game_id === gameId);
        if(!m) return;
        
        const modalBody = document.getElementById('modalBody');
        
        if (m.home_score !== null) {
            // Case 1: 지난 경기 기록 (기록실 스타일)
            const hL = m.home_line ? m.home_line.split('|') : [];
            const aL = m.away_line ? m.away_line.split('|') : [];
            const hRHEB = m.home_rheb ? m.home_rheb.split('|') : [0,0,0,0];
            const aRHEB = m.away_rheb ? m.away_rheb.split('|') : [0,0,0,0];
            
            let inningHeaders = '';
            for(let i=1; i<=Math.max(hL.length, 9); i++) inningHeaders += `<th class="inning-cell">${i}</th>`;

            const rowHTML = (team, line, rheb) => {
                let cells = `<td class="p-2 font-bold bg-gray-50 text-xs">${team}</td>`;
                line.forEach(s => cells += `<td class="inning-cell font-bold">${s}</td>`);
                for(let i=line.length; i<Math.max(line.length, 9); i++) cells += `<td class="inning-cell">-</td>`;
                cells += `<td class="rheb-cell text-red-600">${rheb[0]}</td><td class="rheb-cell">${rheb[1]}</td><td class="rheb-cell">${rheb[2]}</td><td class="rheb-cell">${rheb[3]}</td>`;
                return cells;
            };

            modalBody.innerHTML = `
                <div class="flex justify-between items-center mb-8">
                    <div class="text-center"><div class="text-2xl font-black">${m.away}</div><div class="text-xs text-gray-400">AWAY</div></div>
                    <div class="text-4xl font-black text-blue-600">${m.away_score} : ${m.home_score}</div>
                    <div class="text-center"><div class="text-2xl font-black">${m.home}</div><div class="text-xs text-gray-400">HOME</div></div>
                </div>
                <div class="overflow-x-auto border rounded-xl shadow-sm mb-4">
                    <table class="w-full text-center">
                        <thead class="bg-gray-50 border-b">
                            <tr><th class="p-2 text-xs">팀</th>${inningHeaders}<th class="rheb-cell">R</th><th class="rheb-cell">H</th><th class="rheb-cell">E</th><th class="rheb-cell">B</th></tr>
                        </thead>
                        <tbody>
                            <tr class="border-b">${rowHTML(m.away, aL, aRHEB)}</tr>
                            <tr>${rowHTML(m.home, hL, hRHEB)}</tr>
                        </tbody>
                    </table>
                </div>
                <p class="text-center text-xs text-gray-400">📍 ${m.stadium} | 경기 종료</p>
            `;
        } else {
            // Case 2: 예정된 경기 (예매처 안내)
            // 구단별 예매처 매핑
            const ticketLink = (m.home === '두산' || m.home === '키움') ? '인터파크 티켓' : '티켓링크';
            const ticketUrl = (m.home === '두산' || m.home === '키움') 
                ? 'https://ticket.interpark.com/Contents/Sports/GoodsInfo?SportsCode=07001' 
                : 'https://www.ticketlink.co.kr/sports/baseball';

            modalBody.innerHTML = `
                <div class="text-center py-8">
                    <div class="text-sm text-blue-600 font-bold mb-2">${m.date} ${m.time} 예정</div>
                    <div class="text-3xl font-black mb-6">${m.away} <span class="text-gray-300">VS</span> ${m.home}</div>
                    <div class="bg-gray-50 p-6 rounded-2xl border border-dashed border-gray-300">
                        <p class="text-gray-600 mb-4 font-medium">아직 경기가 시작되지 않았습니다.</p>
                        <a href="${ticketUrl}" target="_blank" class="inline-block bg-red-500 text-white px-8 py-3 rounded-xl font-bold hover:bg-red-600 transition-colors">
                            ${ticketLink}에서 예매하기
                        </a>
                    </div>
                    <p class="mt-4 text-xs text-gray-400">구장: ${m.stadium}</p>
                </div>
            `;
        }
        document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('detailModal').classList.add('hidden'); }

    function getMatchHTML(m, mode) {
        const isToday = m.date === TODAY_STR;
        const isUchwi = m.stadium.includes("취소");
        const score = isUchwi ? `<span class="text-red-500 font-bold text-[0.6rem]">취소</span>` : 
                    (m.home_score !== null ? `<span class="font-bold">${m.home_score}:${m.away_score}</span>` : `<span class="text-gray-300">vs</span>`);
        
        return `<div onclick="openDetail('${m.game_id}')" class="cursor-pointer bg-white border border-gray-100 rounded-lg p-2 mb-1 flex flex-col items-center shadow-sm hover:border-blue-400 ${isToday ? 'today-card' : ''}">
            <div class="flex justify-between items-center w-full text-[0.65rem] md:text-xs font-bold">
                <span class="truncate">${m.home}</span>
                <span class="mx-1">${score}</span>
                <span class="truncate">${m.away}</span>
            </div>
            <div class="text-[0.5rem] md:text-[0.6rem] text-gray-400 mt-1">📍 ${m.stadium.replace("(취소)","")}</div>
        </div>`;
    }

    function renderView() {
        const container = document.getElementById('calendar');
        const filter = document.getElementById('teamFilter').value;
        container.innerHTML = '';

        if (viewMode === 'month') {
            const y = currentDate.getFullYear(), m = currentDate.getMonth() + 1;
            document.getElementById('viewTitle').innerText = `${y}년 ${m}월`;
            const startDay = new Date(y, m-1, 1).getDay(), days = new Date(y, m, 0).getDate();
            
            for(let i=0; i<startDay; i++) container.innerHTML += '<div class="min-h-[80px]"></div>';
            for(let d=1; d<=days; d++) {
                const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = ds === TODAY_STR;
                const matches = allMatches.filter(mt => mt.date === ds && (filter === '전체' || mt.home === filter || mt.away === filter));
                let dayDiv = `<div class="bg-white/50 p-1 min-h-[100px] rounded-lg border border-transparent ${isToday ? 'bg-blue-50 border-blue-200' : ''}"><div class="text-xs font-bold mb-1">${d}</div>`;
                matches.forEach(mt => dayDiv += getMatchHTML(mt, 'month'));
                container.innerHTML += dayDiv + `</div>`;
            }
        }
        // 주간 뷰 생략(동일 로직)
    }

    document.getElementById('modeMonth').onclick = () => { viewMode='month'; renderView(); };
    document.getElementById('modeWeek').onclick = () => { viewMode='week'; renderView(); };
    document.getElementById('prevBtn').onclick = () => { currentDate.setMonth(currentDate.getMonth()-1); renderView(); };
    document.getElementById('nextBtn').onclick = () => { currentDate.setMonth(currentDate.getMonth()+1); renderView(); };
    document.getElementById('teamFilter').onchange = renderView;
    fetchMatches();
</script>
</body>
</html>
