<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚾️ KBO 스마트 캘린더</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: #e5e7eb; }
        .calendar-day { min-height: 160px; background-color: white; padding: 6px; }
        .match-card { font-size: 0.72rem; padding: 6px; border-radius: 6px; margin-top: 4px; border: 1px solid #e5e7eb; background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .score-badge { background-color: #1f2937; color: white; padding: 1px 4px; border-radius: 4px; font-weight: 800; }
        .stadium-info { color: #9ca3af; font-size: 0.65rem; margin-top: 4px; display: block; border-top: 1px dashed #f3f4f6; padding-top: 4px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4">
    <div class="max-w-6xl mx-auto">
        <header class="bg-white p-5 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <button id="prevBtn" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-lg font-bold">◀</button>
                <div class="text-center">
                    <h1 id="monthTitle" class="text-2xl font-black text-gray-800 underline decoration-blue-500 decoration-4">⚾️ KBO 일정 로딩중...</h1>
                </div>
                <button id="nextBtn" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-lg font-bold">▶</button>
            </div>
            <select id="teamFilter" class="border-2 border-gray-100 p-2 rounded-lg text-sm font-bold outline-none focus:border-blue-500 transition-all">
                <option value="전체">전체 구단 일정</option>
                <option value="KIA">KIA 타이거즈</option>
                <option value="KT">KT 위즈</option>
                <option value="LG">LG 트윈스</option>
                <option value="NC">NC 다이노스</option>
                <option value="SSG">SSG 랜더스</option>
                <option value="두산">두산 베어스</option>
                <option value="롯데">롯데 자이언츠</option>
                <option value="삼성">삼성 라이온즈</option>
                <option value="키움">키움 히어로즈</option>
                <option value="한화">한화 이글스</option>
            </select>
        </header>

        <div class="grid grid-cols-7 mb-2 text-center font-black text-gray-400 text-xs uppercase tracking-widest">
            <div class="text-red-400">Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div class="text-blue-400">Sat</div>
        </div>
        <div id="calendar" class="calendar-grid rounded-xl overflow-hidden shadow-lg border border-gray-200"></div>
    </div>

<script>
    const SUPABASE_URL = 'https://rqdwdortnbpkpipussah.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_72QYev7CliIOdaHVa9caFg_mm19QiZE';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allMatches = [];
    let currentDate = new Date();
    
    // API로 불러온 공휴일 정보를 캐싱해둘 변수
    let holidays = {}; 
    let loadedHolidayYear = null;

    async function fetchMatches() {
        const { data, error } = await _supabase.from('kbo_matches').select('*').order('date', {ascending: true});
        if (!error) {
            allMatches = data;
            renderCalendar();
        }
    }

    async function renderCalendar() {
        const container = document.getElementById('calendar');
        const filterValue = document.getElementById('teamFilter').value;
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth() + 1;
        const monthStr = month.toString().padStart(2, '0');

        // 연도가 바뀌었을 때만 공휴일 API를 새로 호출 (최적화)
        if (year !== loadedHolidayYear) {
            try {
                const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`);
                const data = await res.json();
                holidays = {};
                data.forEach(h => { holidays[h.date] = h.localName; });
                loadedHolidayYear = year;
            } catch (e) {
                console.error("공휴일 정보를 불러오는 데 실패했습니다.");
            }
        }

        document.getElementById('monthTitle').innerText = `⚾️ KBO ${year}년 ${month}월`;
        container.innerHTML = '';
        
        const startDay = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();

        // 첫 날 전까지의 빈 칸
        for(let i = 0; i < startDay; i++) {
            container.innerHTML += '<div class="calendar-day bg-gray-50/50"></div>';
        }

        // 날짜 채우기
        for(let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${monthStr}-${day.toString().padStart(2, '0')}`;
            const filtered = allMatches.filter(m => m.date === dateStr && (filterValue === '전체' || m.home.includes(filterValue) || m.away.includes(filterValue)));
            
            // 공휴일 여부 체크
            const holidayName = holidays[dateStr];
            const isWeekendOrHoliday = (day % 7 === (7 - startDay) % 7) || holidayName; // 일요일이거나 공휴일
            const isSaturday = (day % 7 === (8 - startDay) % 7); // 토요일

            let dateColorClass = 'text-gray-400';
            if (isWeekendOrHoliday) dateColorClass = 'text-red-500';
            else if (isSaturday) dateColorClass = 'text-blue-500';

            // 공휴일이면 날짜 옆에 작은 글씨로 이름 표시
            const holidayHtml = holidayName ? `<span class="text-[0.6rem] font-normal text-red-500 ml-1 bg-red-50 px-1 rounded">${holidayName}</span>` : '';
            
            let dayHtml = `<div class="calendar-day"><div class="mb-1"><span class="text-sm font-black ${dateColorClass}">${day}</span>${holidayHtml}</div>`;
            
            filtered.forEach(m => {
                let score;
                if (m.stadium.includes("취소")) {
                    score = `<span class="text-red-500 font-black text-[0.65rem]">우천취소</span>`;
                } else if (m.home_score !== null) {
                    score = `<span class="score-badge">${m.home_score}</span> : <span class="score-badge">${m.away_score}</span>`;
                } else {
                    score = `<span class="text-gray-300 font-bold">vs</span>`;
                }
                
                dayHtml += `
                    <div class="match-card">
                        <div class="flex justify-between items-center gap-1">
                            <span class="font-bold text-gray-700 whitespace-nowrap">${m.home}<span class="text-[0.55rem] text-gray-400 font-normal ml-0.5">(홈)</span></span>
                            <div class="flex-1 text-center">${score}</div>
                            <span class="font-bold text-gray-700 whitespace-nowrap"><span class="text-[0.55rem] text-gray-400 font-normal mr-0.5">(원정)</span>${m.away}</span>
                        </div>
                        <span class="stadium-info">📍 ${m.stadium} | ${m.time}</span>
                    </div>`;
            });
            dayHtml += `</div>`;
            container.innerHTML += dayHtml;
        }
    }

    document.getElementById('prevBtn').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
    document.getElementById('nextBtn').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });
    document.getElementById('teamFilter').addEventListener('change', renderCalendar);
    
    fetchMatches();
</script>
</body>
</html>
