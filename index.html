<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚾️ KBO 스마트 캘린더</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 md:bg-gray-50 min-h-screen p-1 md:p-4">
    <div class="max-w-6xl mx-auto">
        <header class="bg-white p-2 md:p-5 md:rounded-xl shadow-sm mb-2 md:mb-6 flex flex-col md:flex-row justify-between items-center gap-2 md:gap-4 sticky top-0 z-10 md:static">
            <div class="flex items-center justify-between w-full md:w-auto gap-2 md:gap-4">
                <button id="prevBtn" class="p-1.5 px-3 md:px-4 bg-gray-100 hover:bg-gray-200 rounded-lg font-bold">◀</button>
                <div class="text-center flex-1 md:flex-none">
                    <h1 id="monthTitle" class="text-base md:text-2xl font-black text-gray-800 underline decoration-blue-500 decoration-4">⚾️ KBO 일정</h1>
                </div>
                <button id="nextBtn" class="p-1.5 px-3 md:px-4 bg-gray-100 hover:bg-gray-200 rounded-lg font-bold">▶</button>
            </div>
            <select id="teamFilter" class="w-full md:w-auto border-2 border-gray-100 p-1.5 md:p-2.5 rounded-lg text-xs md:text-sm font-bold outline-none focus:border-blue-500 bg-gray-50">
                <option value="전체">전체 구단 일정</option>
                <option value="KIA">KIA 타이거즈</option>
                <option value="KT">KT 위즈</option>
                <option value="LG">LG 트윈스</option>
                <option value="NC">NC 다이노스</option>
                <option value="SSG">SSG 랜더스</option>
                <option value="두산">두산 베어스</option>
                <option value="롯데">롯데 자이언츠</option>
                <option value="삼성">삼성 라이온즈</option>
                <option value="키움">키움 히어로즈</option>
                <option value="한화">한화 이글스</option>
            </select>
        </header>

        <div class="grid grid-cols-7 mb-1 md:mb-2 text-center font-black text-gray-400 text-[0.6rem] md:text-xs uppercase tracking-widest px-0.5 md:px-0">
            <div class="text-red-400">Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div class="text-blue-400">Sat</div>
        </div>

        <div id="calendar" class="grid grid-cols-7 gap-[1px] bg-gray-200 border border-gray-200 rounded-lg md:rounded-xl overflow-hidden pb-6 md:pb-0"></div>
    </div>

<script>
    const SUPABASE_URL = 'https://rqdwdortnbpkpipussah.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_72QYev7CliIOdaHVa9caFg_mm19QiZE';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allMatches = [];
    let currentDate = new Date();
    let holidays = {}; 
    let loadedHolidayYear = null;

    async function fetchMatches() {
        const { data, error } = await _supabase.from('kbo_matches').select('*').order('date', {ascending: true});
        if (!error) {
            allMatches = data;
            renderCalendar();
        }
    }

    async function renderCalendar() {
        const container = document.getElementById('calendar');
        const filterValue = document.getElementById('teamFilter').value;
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth() + 1;
        const monthStr = month.toString().padStart(2, '0');

        if (year !== loadedHolidayYear) {
            try {
                const DATA_GO_KR_KEY = '4b4ad3442715e2758dd90b80e40e0a219d74b6ca6f870ad85cdeb8a37709e073';
                const url = `https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo?solYear=${year}&ServiceKey=${DATA_GO_KR_KEY}&_type=json&numOfRows=50`;
                const res = await fetch(url);
                const json = await res.json();
                
                holidays = {}; 
                const items = json.response?.body?.items?.item;
                if (items) {
                    const holidayArray = Array.isArray(items) ? items : [items];
                    holidayArray.forEach(h => {
                        const dateStr = String(h.locdate).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');
                        holidays[dateStr] = h.dateName; 
                    });
                }
                loadedHolidayYear = year;
            } catch (e) { console.error("공휴일 로드 실패:", e); }
        }

        document.getElementById('monthTitle').innerText = `⚾️ ${year}년 ${month}월`;
        container.innerHTML = '';
        
        const startDay = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();

        for(let i = 0; i < startDay; i++) {
            container.innerHTML += '<div class="bg-gray-50/40 min-h-[90px] md:min-h-[120px]"></div>';
        }

        for(let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${monthStr}-${day.toString().padStart(2, '0')}`;
            const filtered = allMatches.filter(m => m.date === dateStr && (filterValue === '전체' || m.home.includes(filterValue) || m.away.includes(filterValue)));
            
            const currentDayOfWeek = new Date(year, month - 1, day).getDay();
            const holidayName = holidays[dateStr];
            
            let dateColorClass = 'text-gray-700';
            if (currentDayOfWeek === 0 || holidayName) dateColorClass = 'text-red-500';
            else if (currentDayOfWeek === 6) dateColorClass = 'text-blue-500';

            const holidayHtml = holidayName ? `<div class="text-[0.45rem] md:text-[0.6rem] font-normal text-red-500 leading-none mt-0.5 md:mt-0 md:inline block truncate px-[1px] md:ml-1">${holidayName}</div>` : '';
            
            let dayHtml = `<div class="bg-white p-0.5 md:p-2 min-h-[90px] md:min-h-[120px] flex flex-col">
                <div class="mb-0.5 md:mb-1 border-b border-gray-100 pb-[1px] md:pb-0 text-center md:text-left">
                    <span class="text-[0.7rem] md:text-sm font-black ${dateColorClass}">${day}</span>
                    ${holidayHtml}
                </div>`;
            
            filtered.forEach(m => {
                let scoreHtml;
                // 우취 식별 및 문자열 정리 (화면엔 '잠실(우취)' 대신 '잠실'만 나오게)
                let isCancelled = m.stadium.includes("취소") || m.stadium.includes("우취");
                let displayStadium = m.stadium.replace("(우취)", "").trim();
                
                if (isCancelled) {
                    scoreHtml = `<span class="text-blue-500 font-bold text-[0.55rem] md:text-[0.65rem] bg-blue-50 px-1 py-[1px] rounded-[2px]">우취</span>`;
                } else if (m.home_score !== null) {
                    let hBg = m.home_score > m.away_score ? 'bg-red-600' : 'bg-gray-700';
                    let aBg = m.away_score > m.home_score ? 'bg-red-600' : 'bg-gray-700';
                    scoreHtml = `<span class="${hBg} text-white px-[3px] py-[1px] rounded-[2px]">${m.home_score}</span><span class="mx-[1px] text-gray-300 font-normal">:</span><span class="${aBg} text-white px-[3px] py-[1px] rounded-[2px]">${m.away_score}</span>`;
                } else {
                    scoreHtml = `<span class="text-gray-400 font-bold bg-gray-50 px-1 py-[1px] rounded-[2px]">vs</span>`;
                }
                
                dayHtml += `
                    <div class="bg-white border border-gray-100 rounded shadow-[0_1px_2px_rgba(0,0,0,0.02)] p-[2px] md:p-1 mb-[2px] md:mb-1 w-full flex flex-col justify-center items-center">
                        <div class="flex justify-between items-center w-full leading-tight">
                            <div class="flex-1 text-right truncate font-bold text-[0.55rem] md:text-xs text-gray-800">${m.home}</div>
                            <div class="flex-none px-0.5 text-[0.5rem] md:text-xs whitespace-nowrap text-center font-bold font-mono">${scoreHtml}</div>
                            <div class="flex-1 text-left truncate font-bold text-[0.55rem] md:text-xs text-gray-800">${m.away}</div>
                        </div>
                        <div class="text-[0.4rem] md:text-[0.6rem] text-gray-400 truncate mt-[1px] md:mt-[2px] tracking-tighter w-full text-center">
                            📍${displayStadium} | ${m.time}
                        </div>
                    </div>`;
            });
            dayHtml += `</div>`;
            container.innerHTML += dayHtml;
        }
    }

    document.getElementById('prevBtn').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
    document.getElementById('nextBtn').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });
    document.getElementById('teamFilter').addEventListener('change', renderCalendar);
    
    fetchMatches();
</script>
</body>
</html>
