<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2eb">
  <meta name="description" content="KBO 경기 일정, 예매 시점, 경기 결과를 한 흐름에서 확인하세요.">
  <title>KBO GameDay</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="desktop-sidebar" aria-label="주요 메뉴">
      <a class="wordmark" href="./" aria-label="KBO GameDay 홈">KBO GameDay</a>
      <div class="sidebar-team">
        <span class="eyebrow">응원팀</span>
        <button class="team-button" id="sidebarTeamButton" type="button">
          <span class="team-dot" data-team-dot="LG"></span>
          <strong data-favorite-team>LG</strong>
          <span class="button-hint">변경</span>
        </button>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item" data-view="today" type="button">오늘</button>
        <button class="nav-item is-active" data-view="schedule" type="button">일정</button>
        <button class="nav-item" data-view="settings" type="button">설정</button>
      </nav>
      <div class="sidebar-rules">
        <strong>표시 규칙</strong>
        <span>원정팀 왼쪽, 홈팀 오른쪽</span>
        <span>월간 셀은 최대 3경기 표시</span>
      </div>
    </aside>

    <main class="main-content" id="mainContent">
      <header class="mobile-header">
        <a class="wordmark" href="./">KBO GameDay</a>
        <button class="team-chip" id="mobileTeamButton" type="button" aria-label="응원팀 변경">
          <span class="team-dot" data-team-dot="LG"></span>
          <strong data-favorite-team>LG</strong>
          <span aria-hidden="true">⌄</span>
        </button>
      </header>
      <div id="dataNotice" class="data-notice" role="status" hidden></div>

      <section class="view" id="todayView" data-view-panel="today" hidden>
        <div class="content-column today-layout">
          <div id="nextGameMount"></div>
          <section class="section-block" aria-labelledby="todayGamesTitle">
            <div class="section-heading">
              <div>
                <h1 id="todayGamesTitle">오늘의 경기</h1>
                <p id="todayDateLabel" class="section-meta"></p>
              </div>
              <button class="text-button" type="button" data-view="schedule">주간 일정 <span aria-hidden="true">→</span></button>
            </div>
            <div id="todayGamesMount"></div>
          </section>
          <p class="freshness" id="todayFreshness"></p>
        </div>
      </section>

      <section class="view schedule-view" id="scheduleView" data-view-panel="schedule">
        <header class="schedule-toolbar">
          <div class="date-navigation">
            <h1 id="scheduleTitle">일정</h1>
            <div class="nav-buttons" aria-label="기간 이동">
              <button class="icon-button" id="previousPeriod" type="button" aria-label="이전 기간">‹</button>
              <button class="period-button" id="currentPeriod" type="button">이번 주</button>
              <button class="icon-button" id="nextPeriod" type="button" aria-label="다음 기간">›</button>
            </div>
          </div>
          <div class="schedule-filters" aria-label="일정 필터">
            <div class="segmented" id="teamScopeFilter">
              <button class="is-active" type="button" data-scope="favorite">내 팀 경기</button>
              <button type="button" data-scope="all">전체 10개 구단</button>
            </div>
            <div class="segmented compact" id="venueFilter">
              <button class="is-active" type="button" data-venue="all">전체</button>
              <button type="button" data-venue="home">홈</button>
              <button type="button" data-venue="away">원정</button>
            </div>
          </div>
        </header>

        <div class="schedule-workspace">
          <div class="calendar-panel">
            <div id="monthCalendar" class="month-calendar"></div>
            <div id="weekSchedule" class="week-schedule"></div>
            <footer class="calendar-legend" aria-label="경기 상태 범례">
              <span><i class="legend-swatch scheduled"></i>예정</span>
              <span><i class="legend-swatch live"></i>LIVE</span>
              <span><i class="legend-swatch final"></i>종료</span>
              <span><i class="legend-swatch cancelled"></i>취소</span>
              <span><i class="legend-swatch postponed"></i>연기</span>
              <span id="scheduleFreshness" class="legend-freshness"></span>
            </footer>
          </div>
          <aside class="day-panel" id="selectedDayPanel" aria-label="선택한 날짜 경기"></aside>
        </div>
      </section>

      <section class="view" id="settingsView" data-view-panel="settings" hidden>
        <div class="content-column settings-layout">
          <header class="simple-heading">
            <h1>설정</h1>
            <p>응원팀과 데이터 표시 방식을 관리합니다.</p>
          </header>
          <section class="settings-section">
            <h2>응원팀</h2>
            <div class="team-picker" id="teamPicker"></div>
          </section>
          <section class="settings-section source-card">
            <div>
              <h2>데이터 출처</h2>
              <p>KBO 공식 경기 일정을 수집해 표시합니다. 점수와 기록은 수집 상태에 따라 늦게 반영될 수 있습니다.</p>
            </div>
            <span id="settingsFreshness" class="source-status"></span>
          </section>
        </div>
      </section>
    </main>
  </div>

  <nav class="mobile-bottom-nav" aria-label="모바일 주요 메뉴">
    <button data-view="today" type="button"><span aria-hidden="true">⌂</span><strong>오늘</strong></button>
    <button class="is-active" data-view="schedule" type="button"><span aria-hidden="true">▦</span><strong>일정</strong></button>
    <button data-view="settings" type="button"><span aria-hidden="true">⚙</span><strong>설정</strong></button>
  </nav>

  <dialog class="game-dialog" id="gameDialog" aria-labelledby="dialogTitle">
    <div class="dialog-shell">
      <header class="dialog-header">
        <button class="dialog-back" id="closeDialog" type="button" aria-label="경기 상세 닫기">←</button>
        <h1 id="dialogTitle">경기 상세</h1>
        <button class="dialog-share" id="shareGame" type="button">공유</button>
      </header>
      <div id="dialogBody" class="dialog-body"></div>
    </div>
  </dialog>

  <script src="./app.js" defer></script>
</body>
</html>
