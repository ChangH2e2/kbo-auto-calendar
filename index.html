<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚾️ KBO 2026 스마트 캘린더</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background-color: #e5e7eb; }
        .calendar-day { min-height: 160px; background-color: white; padding: 6px; }
        .match-card { 
            font-size: 0.72rem; padding: 6px; border-radius: 6px; margin-top: 4px; 
            border: 1px solid #e5e7eb; background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .score-badge { background-color: #1f2937; color: white; padding: 1px 4px; border-radius: 4px; font-weight: 800; }
        .stadium-info { color: #9ca3af; font-size: 0.65rem; margin-top: 4px; display: block; border-top: 1px dashed #f3f4f6; padding-top: 4px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4">
    <div class="max-w-6xl mx-auto">
        <header class="bg-white p-5 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-black text-gray-800 underline decoration-blue-500 decoration-4">⚾️ KBO <span id="currentYear">2026</span> 일정 & 결과</h1>
                <p class="text-xs text-gray-400 mt-1">실시간 경기 결과 및 예매 정보 (Home vs Away)</p>
            </div>
            <div class="flex items-center gap-2">
                <button id="prevMonth" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">◀️</button>
                <span id="viewMonth" class="text-lg font-black min-w-[80px] text-center">2026.05</span>
                <button id="nextMonth" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">▶️</button>
                <select id="teamFilter" class="ml-4 border-2 border-gray-100 p-2 rounded-lg text-sm font-bold outline-none focus:border-blue-500 transition-all">
                    <option value="전체">전체 구단</option>
                    <option value="삼성">삼성</option> <option value="LG">LG</option>
                    <option value="SSG">SSG</option> <option value="NC">NC</option>
                    <option value="두산">두산</option> <option value="KIA">KIA</option>
                    <option value="롯데">롯데</option> <option value="한화">한화</option>
                    <option value="키움">키움</option> <option value="KT">KT</option>
                </select>
            </div>
        </header>

        <div class="grid grid-cols-7 mb-2 text-center font-black text-gray-400 text-xs uppercase tracking-widest">
            <div class="text-red-400">Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div class="text-blue-400">Sat</div>
        </div>
        <div id="calendar" class="calendar-grid rounded-xl overflow-hidden shadow-lg border border-gray-200"></div>
    </div>

<script>
    const SUPABASE_URL = 'https://rqdwdortnbpkpipussah.supabase.co';
    const SUPABASE_KEY = '여기에_창희님의_ANON_KEY_입력';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentDate = new Date(); // 현재 날짜 기준
    let allMatches = [];

    async function fetchAllData() {
        const { data, error } = await _supabase.from('kbo_matches').select('*').order('date', {ascending: true});
        if (error) {
            console.error('Data fetch error:', error);
            return;
        }
        allMatches = data;
        renderCalendar();
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const filterValue = document.getElementById('teamFilter').value;
        
        document.getElementById('currentYear').innerText = year;
        document.getElementById('viewMonth').innerText = `${year}.${(month + 1).toString().padStart(2, '0')}`;

        const container = document.getElementById('calendar');
        container.innerHTML = '';
        
        const firstDay = new Date(year, month, 1).getDay(); // 0: Sun, 1: Mon, ...
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        // 빈 칸 채우기
        for(let i=0; i<firstDay; i++) container.innerHTML += '<div class="calendar-day bg-gray-50/50"></div>';

        for(let day=1; day<=daysInMonth; day++) {
            const dateStr = `${year}-${(month + 1).toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
            const dayOfWeek = new Date(year, month, day).getDay();
            
            const filtered = allMatches.filter(m => m.date === dateStr && (filterValue === '전체' || m.home.includes(filterValue) || m.away.includes(filterValue)));
            
            let dateColor = 'text-gray-400';
            if (dayOfWeek === 0) dateColor = 'text-red-500';
            if (dayOfWeek === 6) dateColor = 'text-blue-500';

            let dayHtml = `<div class="calendar-day"><span class="text-sm font-black ${dateColor}">${day}</span>`;
            filtered.forEach(m => {
                const score = (m.home_score !== null) 
                    ? `<span class="score-badge">${m.home_score}</span> : <span class="score-badge">${m.away_score}</span>`
                    : `<span class="text-gray-300 font-bold">vs</span>`;
                
                dayHtml += `
                    <div class="match-card">
                        <div class="flex justify-between items-center gap-1">
                            <span class="font-bold text-gray-700">${m.home}</span>
                            ${score}
                            <span class="font-bold text-gray-700">${m.away}</span>
                        </div>
                        <span class="stadium-info">📍 ${m.stadium} | ${m.time}</span>
                    </div>`;
            });
            dayHtml += `</div>`;
            container.innerHTML += dayHtml;
        }
    }

    document.getElementById('prevMonth').onclick = () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    };

    document.getElementById('nextMonth').onclick = () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    };

    document.getElementById('teamFilter').onchange = () => renderCalendar();

    fetchAllData();
</script>
</body>
</html>
